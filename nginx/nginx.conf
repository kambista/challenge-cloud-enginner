worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 1m;

    # Rate limiting básico para proteger la API (20 req/s por IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    server {
        listen 80;
        server_name _;

        # Resolución dinámica contra kube-dns para evitar fallos si el backend aún no existe
        resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

        # Endpoint propio de Nginx para probes de Kubernetes y GCP Load Balancer
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            limit_req zone=api_limit burst=40 nodelay;

            set $backend "http://quotes-api.quotes.svc.cluster.local:3000";
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout    15s;
            proxy_read_timeout    15s;
        }
    }
}

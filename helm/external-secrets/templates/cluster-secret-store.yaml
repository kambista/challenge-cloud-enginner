apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.storeName }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  conditions:
    - namespaces:
        {{- toYaml (required "namespaces es obligatorio" .Values.namespaces) | nindent 8 }}
  provider:
    gcpsm:
      projectID: {{ required "projectId es obligatorio" .Values.projectId }}

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/json;

    map $http_x_forwarded_for $client_ip {
        "~(?<ip>[^,\s]+),\s*[^,\s]+$" $ip;
        default                        $remote_addr;
    }

    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"request_id":"$req_id",'
        '"client":"$client_ip",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
    '}';
    access_log /dev/stdout json;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;

    keepalive_timeout     65s;
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          30s;
    client_max_body_size  1m;

    gzip            on;
    gzip_types      application/json text/plain;
    gzip_min_length 1024;

    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

{{- if .Values.rateLimit.enabled }}
    limit_req_zone   $client_ip zone=per_ip:10m rate={{ .Values.rateLimit.requestsPerSecond }}r/s;
    limit_req_status 429;
{{- end }}

    upstream quotes_api {
        server {{ .Values.upstream }};
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
{{- if .Values.rateLimit.enabled }}
            limit_req zone=per_ip burst={{ .Values.rateLimit.burst }} nodelay;
{{- end }}
            proxy_pass http://quotes_api;
            proxy_http_version 1.1;

            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header X-Request-ID      $req_id;

            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;

            proxy_next_upstream       error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }
    }
}

apiVersion: v1
kind: Service
metadata:
  name: quotes-nginx
  labels:
    app: quotes-nginx
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "quotes-nginx"}'
spec:
  type: ClusterIP
  selector:
    app: quotes-nginx
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: quotes-nginx
  labels:
    app: quotes-nginx
    {{- include "common.labels" . | nindent 4 }}
spec:
  timeoutSec: 30
  connectionDraining:
    drainingTimeoutSec: 30
  healthCheck:
    type: HTTP
    requestPath: /healthz
    port: 8080
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
  logging:
    enable: true
    sampleRate: 1.0
  {{- with .Values.ingress.securityPolicy }}
  securityPolicy:
    name: {{ . }}
  {{- end }}

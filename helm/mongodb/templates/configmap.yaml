apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init
  labels:
    app: mongodb
    {{- include "common.labels" . | nindent 4 }}
data:
  01-create-app-user.js: |
    db.getSiblingDB("{{ .Values.database }}").createUser({
      user: "{{ .Values.appUsername }}",
      pwd: process.env.MONGO_APP_PASSWORD,
      roles: [{ role: "readWrite", db: "{{ .Values.database }}" }]
    });

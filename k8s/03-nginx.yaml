apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: nginx-backend-config
  namespace: quotes
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /healthz
    port: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: quotes
data:
  nginx.conf: |
    worker_processes auto;

    events {
        worker_connections 1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        sendfile        on;
        keepalive_timeout 65;
        client_max_body_size 1m;

        limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

        server {
            listen 80;
            server_name _;

            resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

            location = /healthz {
                access_log off;
                add_header Content-Type text/plain;
                return 200 "ok\n";
            }

            location / {
                limit_req zone=api_limit burst=40 nodelay;

                set $backend "http://quotes-api.quotes.svc.cluster.local:3000";
                proxy_pass $backend;
                proxy_http_version 1.1;
                proxy_set_header Connection "";

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                proxy_connect_timeout 5s;
                proxy_send_timeout    15s;
                proxy_read_timeout    15s;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-proxy
  namespace: quotes
  labels:
    app: nginx-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-proxy
  template:
    metadata:
      labels:
        app: nginx-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-proxy
  namespace: quotes
  annotations:
    cloud.google.com/backend-config: '{"default": "nginx-backend-config"}'
  labels:
    app: nginx-proxy
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: nginx-proxy

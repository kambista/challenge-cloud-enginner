apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: quotes-managed-cert
  namespace: quotes
spec:
  domains:
    - 34.110.231.216.nip.io
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quotes-ingress
  namespace: quotes
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "quotes-ingress-ip"
    networking.gke.io/managed-certificates: "quotes-managed-cert"
spec:
  defaultBackend:
    service:
      name: nginx-proxy
      port:
        number: 80
